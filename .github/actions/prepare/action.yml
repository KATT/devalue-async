description: Prepares the repo for a typical CI job

name: Prepare

runs:
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        cache: pnpm
        node-version: 24.19.0
    - run: pnpm install --frozen-lockfile
      shell: bash
  using: composite
